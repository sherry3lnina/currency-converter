<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notion Currency Converter</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-[#FDE5E8] text-[#2d2d2d] font-sans antialiased p-3">

    <div class="w-full bg-white/60 backdrop-blur-md border border-[#f0cbd0] rounded-xl shadow-sm p-4 transition-all duration-300">
        
        <div class="flex items-center justify-between mb-4">
            <h2 class="text-sm font-bold tracking-wide text-[#4a3538]">Currency Converter</h2>
            <span id="last-updated" class="text-[10px] text-gray-500 font-medium">Updating...</span>
        </div>

        <div class="mb-3">
            <label class="block text-[10px] font-bold text-[#705256] uppercase tracking-wider mb-1">Amount</label>
            <input type="number" id="amount" value="100" class="w-full bg-white border border-[#e1b3b8] rounded-lg px-3 py-2 text-[#2d2d2d] focus:outline-none focus:border-[#d48893] transition text-base font-semibold">
        </div>

        <div class="grid grid-cols-2 gap-3 mb-4">
            <div>
                <label class="block text-[10px] font-bold text-[#705256] uppercase tracking-wider mb-1">From</label>
                <select id="from-currency" class="w-full bg-white border border-[#e1b3b8] rounded-lg px-2 py-2 text-sm text-[#2d2d2d] focus:outline-none focus:border-[#d48893] transition cursor-pointer font-medium">
                    <option value="USD" selected>USD - Dollar</option>
                    <option value="EUR">EUR - Euro</option>
                    <option value="GBP">GBP - Pound</option>
                    <option value="JPY">JPY - Yen</option>
                    <option value="KRW">KRW - Won </option>
                    <option value="AUD">AUD - Dollar</option>
                    <option value="CAD">CAD - Dollar</option>
                    <option value="SGD">SGD - Dollar</option>
                    <option value="MYR">MYR - Ringgit</option>
                    <option value="IDR">IDR - Rupiah</option>
                    <option value="THB">THB - Baht</option>
                    <option value="VND">VND - Dong</option>
                    <option value="CNY">CNY - Yuan</option>
                    <option value="KHR">KHR - Riel </option>
                    <option value="AED">AED - Dirham</option>
                </select>
            </div>
            <div>
                <label class="block text-[10px] font-bold text-[#705256] uppercase tracking-wider mb-1">To</label>
                <select id="to-currency" class="w-full bg-white border border-[#e1b3b8] rounded-lg px-2 py-2 text-sm text-[#2d2d2d] focus:outline-none focus:border-[#d48893] transition cursor-pointer font-medium">
                    <option value="EUR" selected>EUR - Euro</option>
                    <option value="USD">USD - Dollar</option>
                    <option value="GBP">GBP - Pound</option>
                    <option value="JPY">JPY - Yen</option>
                    <option value="KRW">KRW - Won </option>
                    <option value="AUD">AUD - Dollar</option>
                    <option value="CAD">CAD - Dollar</option>
                    <option value="SGD">SGD - Dollar</option>
                    <option value="MYR">MYR - Ringgit</option>
                    <option value="IDR">IDR - Rupiah</option>
                    <option value="THB">THB - Baht</option>
                    <option value="VND">VND - Dong</option>
                    <option value="CNY">CNY - Yuan</option>
                    <option value="KHR">KHR - Riel </option>
                    <option value="AED">AED - Dirham</option>
                </select>
            </div>
        </div>

        <div class="flex justify-center mb-4">
            <button id="swap-btn" class="bg-white hover:bg-[#fff0f2] border border-[#e1b3b8] text-gray-600 rounded-full p-2 transition-all transform hover:rotate-180 duration-300 focus:outline-none text-xs shadow-sm">
                🔄
            </button>
        </div>

        <div class="bg-white/80 border border-[#e1b3b8] rounded-lg p-3 text-center shadow-inner">
            <p class="text-[10px] font-bold text-[#705256] mb-0.5">Converted Amount</p>
            <div id="result" class="text-xl font-black text-[#c75264] tracking-tight">Calculating...</div>
            <p id="rate-text" class="text-[10px] text-gray-500 font-medium mt-1"></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
