<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notion Currency Converter</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        /* Custom scrollbar to match Notion's aesthetic */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #e4e4e7; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #d4d4d8; }
    </style>
</head>
<body class="bg-[#191919] text-[#e3e3e3] font-sans antialiased flex items-center justify-center min-h-screen p-4">

    <div class="w-full max-w-md bg-[#202020] border border-[#2e2e2e] rounded-xl shadow-xl p-6 transition-all duration-300">
        <div class="flex items-center justify-between mb-6">
            <h2 class="text-lg font-semibold tracking-wide text-white">Currency Converter</h2>
            <span id="last-updated" class="text-xs text-gray-500">Updating...</span>
        </div>

        <div class="mb-4">
            <label class="block text-xs font-medium text-gray-400 uppercase tracking-wider mb-2">Amount</label>
            <input type="number" id="amount" value="100" class="w-full bg-[#2a2a2a] border border-[#3f3f3f] rounded-lg px-4 py-3 text-white focus:outline-none focus:border-blue-500 transition text-lg font-medium">
        </div>

        <div class="grid grid-cols-2 gap-4 mb-6">
            <div>
                <label class="block text-xs font-medium text-gray-400 uppercase tracking-wider mb-2">From</label>
                <select id="from-currency" class="w-full bg-[#2a2a2a] border border-[#3f3f3f] rounded-lg px-3 py-2.5 text-white focus:outline-none focus:border-blue-500 transition cursor-pointer">
                    <option value="USD" selected>USD - US Dollar</option>
                    <option value="EUR">EUR - Euro</option>
                    <option value="GBP">GBP - British Pound</option>
                    <option value="JPY">JPY - Japanese Yen</option>
                    <option value="AUD">AUD - Australian Dollar</option>
                    <option value="CAD">CAD - Canadian Dollar</option>
                    <option value="SGD">SGD - Singapore Dollar</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-medium text-gray-400 uppercase tracking-wider mb-2">To</label>
                <select id="to-currency" class="w-full bg-[#2a2a2a] border border-[#3f3f3f] rounded-lg px-3 py-2.5 text-white focus:outline-none focus:border-blue-500 transition cursor-pointer">
                    <option value="EUR" selected>EUR - Euro</option>
                    <option value="USD">USD - US Dollar</option>
                    <option value="GBP">GBP - British Pound</option>
                    <option value="JPY">JPY - Japanese Yen</option>
                    <option value="AUD">AUD - Australian Dollar</option>
                    <option value="CAD">CAD - Canadian Dollar</option>
                    <option value="SGD">SGD - Singapore Dollar</option>
                </select>
            </div>
        </div>

        <div class="flex justify-center mb-6">
            <button id="swap-btn" class="bg-[#2a2a2a] hover:bg-[#353535] border border-[#3f3f3f] text-gray-300 rounded-full p-2.5 transition-all transform hover:rotate-180 duration-300 focus:outline-none">
                🔄
            </button>
        </div>

        <div class="bg-[#252525] border border-[#2e2e2e] rounded-lg p-4 text-center">
            <p class="text-xs text-gray-400 mb-1">Converted Amount</p>
            <div id="result" class="text-2xl font-bold text-emerald-400 tracking-tight">Calculating...</div>
            <p id="rate-text" class="text-xs text-gray-500 mt-2"></p>
        </div>
    </div>

<script>
    // Updated stable endpoint URL structure
    const API_URL = 'https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies';

    const amountInput = document.getElementById('amount');
    const fromSelect = document.getElementById('from-currency');
    const toSelect = document.getElementById('to-currency');
    const resultDiv = document.getElementById('result');
    const rateText = document.getElementById('rate-text');
    const lastUpdated = document.getElementById('last-updated');
    const swapBtn = document.getElementById('swap-btn');

    async function convertCurrency() {
        const amount = amountInput.value;
        const from = fromSelect.value.toLowerCase();
        const to = toSelect.value.toLowerCase();

        if (amount === '' || amount <= 0) {
            resultDiv.innerText = "0.00";
            return;
        }

        try {
            // New structure fetches the currency file directly
            const response = await fetch(`${API_URL}/${from}.json`);
            const data = await response.json();
            
            // Extracts the exchange rates from the object array
            const rate = data[from][to];
            const convertedAmount = (amount * rate).toFixed(2);
            
            const formattedResult = new Intl.NumberFormat('en-US', { style: 'currency', currency: to.toUpperCase() }).format(convertedAmount);
            
            resultDiv.innerText = formattedResult;
            rateText.innerText = `1 ${from.toUpperCase()} = ${rate.toFixed(4)} ${to.toUpperCase()}`;
            
            const now = new Date();
            lastUpdated.innerText = `Updated: ${now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}`;
        } catch (error) {
            console.error("Error fetching rates:", error);
            resultDiv.innerText = "Error loading rates";
        }
    }

    // Event Listeners
    amountInput.addEventListener('input', convertCurrency);
    fromSelect.addEventListener('change', convertCurrency);
    toSelect.addEventListener('change', convertCurrency);

    // Swap functionality
    swapBtn.addEventListener('click', () => {
        const temp = fromSelect.value;
        fromSelect.value = toSelect.value;
        toSelect.value = temp;
        convertCurrency();
    });

    // Initial run on load
    convertCurrency();
</script>
</body>
</html>
